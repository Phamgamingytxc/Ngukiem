name: Build KiemBayXuatHon
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build
        run: |
          if ls *.zip >/dev/null 2>&1; then
            mkdir -p src_build
            unzip -oq "$(ls *.zip | head -n1)" -d src_build
            DIR=src_build
          else
            DIR=.
          fi
          POM=$(find "$DIR" -name pom.xml | head -n1)
          echo "pom: $POM"
          cd "$(dirname "$POM")"
          mvn -B clean package
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp target/*.jar "$GITHUB_WORKSPACE/out/"
      - uses: actions/upload-artifact@v4
        with:
          name: KiemBayXuatHon-jar
          path: out/*.jar
