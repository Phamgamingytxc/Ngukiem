name: Build KiemBayXuatHon
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Giai nen source
        run: unzip -oq KiemBayXuatHon-Paper-1_21_11-Source.zip -d src_build
      - name: Build
        run: mvn -B clean package
        working-directory: src_build
      - uses: actions/upload-artifact@v4
        with:
          name: KiemBayXuatHon-jar
          path: src_build/target/*.jar
